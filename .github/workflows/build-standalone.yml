name: Build standalone

on:
  push:
    tags:
      - "v*"           # trigger on version tags: v1.2, v1.3, etc.
  workflow_dispatch:   # manual trigger from GitHub UI (builds artifacts without release)

permissions:
  contents: write      # needed to create GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false  # don't cancel other platforms if one fails
      matrix:
        include:
          - os: windows-latest
            artifact: Caulky-windows.exe
            label: windows
          - os: ubuntu-latest
            artifact: Caulky-linux
            label: linux
          - os: macos-latest
            artifact: Caulky-macos
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Build frontend ────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Set up Python ─────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-standalone.txt

      - name: Install Python deps
        run: pip install pyinstaller Pillow -r backend/requirements-standalone.txt

      # ── Generate app icon with Pillow (Windows + macOS only) ──────────────
      - name: Generate icon
        if: matrix.label != 'linux'
        shell: python
        run: |
          from PIL import Image, ImageDraw
          import os, sys

          def make_icon(size):
              img = Image.new('RGBA', (size, size), (15, 23, 42, 255))
              d = ImageDraw.Draw(img)
              lw = max(1, size // 28)
              white = (255, 255, 255, 255)
              m = size // 6
              r = size // 12
              body_top = m + m // 3
              d.rounded_rectangle([m, body_top, size - m, size - m], radius=r, outline=white, width=lw)
              flap_y = body_top + (size - m - body_top) // 3
              d.line([(m, flap_y), (size - m, flap_y)], fill=white, width=lw)
              cx = size - m - size // 7
              cy = body_top + (size - m - body_top) * 2 // 3
              cr = size // 11
              d.ellipse([cx - cr, cy - cr, cx + cr, cy + cr], outline=white, width=lw)
              return img

          if sys.platform == 'win32':
              make_icon(256).save(
                  'app-icon.ico', format='ICO',
                  sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
              )
              print(f"Created app-icon.ico ({os.path.getsize('app-icon.ico')} bytes)")

          elif sys.platform == 'darwin':
              os.makedirs('Caulky.iconset', exist_ok=True)
              for size in [16, 32, 64, 128, 256, 512]:
                  make_icon(size).save(f'Caulky.iconset/icon_{size}x{size}.png')
                  make_icon(size * 2).save(f'Caulky.iconset/icon_{size}x{size}@2x.png')
              os.system('iconutil -c icns Caulky.iconset')
              print(f"Created Caulky.icns ({os.path.getsize('Caulky.icns')} bytes)")

      # ── Build executable ──────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller caulky-standalone.spec

      # ── Rename + make executable ──────────────────────────────────────────
      - name: Rename and prepare artifact
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "windows" ]; then
            mv dist/Caulky.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/Caulky "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      # ── Always upload as workflow artifact (available from Actions UI) ─────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      # ── Upload to GitHub Release (only on tag push) ───────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
