name: Build standalone

on:
  push:
    tags:
      - "v*"           # trigger on version tags: v1.2, v1.3, etc.
  workflow_dispatch:   # manual trigger from GitHub UI (builds artifacts without release)

permissions:
  contents: write      # needed to create GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false  # don't cancel other platforms if one fails
      matrix:
        include:
          - os: windows-latest
            artifact: Caulky-windows.exe
            label: windows
          - os: ubuntu-latest
            artifact: Caulky-linux
            label: linux
          - os: macos-latest
            artifact: Caulky-macos
            label: macos

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Build frontend ────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── Set up Python ─────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-standalone.txt

      - name: Install Python deps
        run: pip install pyinstaller -r backend/requirements-standalone.txt

      # Linux executables don't embed icons — skip icon tools on Linux
      - name: Install icon tools
        if: matrix.label != 'linux'
        run: pip install svglib reportlab Pillow

      # ── Generate app icon from SVG (Windows + macOS only) ─────────────────
      - name: Generate icon
        if: matrix.label != 'linux'
        shell: python
        run: |
          from svglib.svglib import svg2rlg
          from reportlab.graphics import renderPM
          from PIL import Image
          import io, os, sys

          drawing = svg2rlg('frontend/public/icon.svg')
          buf = io.BytesIO()
          renderPM.drawToFile(drawing, buf, fmt='PNG')
          buf.seek(0)
          img = Image.open(buf).convert('RGBA').resize((512, 512), Image.LANCZOS)

          if sys.platform == 'win32':
              img.save('app-icon.ico', format='ICO',
                       sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          elif sys.platform == 'darwin':
              os.makedirs('Caulky.iconset', exist_ok=True)
              for size in [16, 32, 64, 128, 256, 512]:
                  img.resize((size, size), Image.LANCZOS).save(f'Caulky.iconset/icon_{size}x{size}.png')
                  img.resize((size*2, size*2), Image.LANCZOS).save(f'Caulky.iconset/icon_{size}x{size}@2x.png')
              os.system('iconutil -c icns Caulky.iconset')

      # ── Build executable ──────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller caulky-standalone.spec

      # ── Rename + make executable ──────────────────────────────────────────
      - name: Rename and prepare artifact
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = "windows" ]; then
            mv dist/Caulky.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/Caulky "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      # ── Always upload as workflow artifact (available from Actions UI) ─────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      # ── Upload to GitHub Release (only on tag push) ───────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
