upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — todas las rutas desconocidas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html apunta a los bundles con hash de cada build: sin esto el navegador lo
        # cachea por heurística y sigue cargando la versión anterior tras actualizar
        add_header Cache-Control "no-cache" always;
    }

    # Los bundles llevan hash en el nombre: cada build genera ficheros nuevos
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Proxy de la API al backend (incluye WebSocket para el terminal IA)
    location /api/ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Proxy de uploads estáticos (archivos adjuntos a movimientos)
    location /uploads/ {
        proxy_pass http://backend_upstream;
    }
}
