server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker — permite re-resolver si el backend reinicia
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA — todas las rutas desconocidas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API al backend
    location /api/ {
        set $backend_url http://backend:8000;
        proxy_pass         $backend_url;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Proxy de uploads estáticos (archivos adjuntos a movimientos)
    location /uploads/ {
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
    }
}
